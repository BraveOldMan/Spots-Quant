[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "data_seasons",
    "kaggle_dataset",
    "logs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
